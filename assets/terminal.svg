.off{animation:off .01s linear forwards}
.fade{opacity:0;animation:fade .6s ease-out forwards}
.blink{animation:blink 1.1s steps(1) infinite}
.float{animation:float 5s ease-in-out infinite alternate}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-out infinite}
@keyframes on{to{opacity:1}}
@keyframes off{to{opacity:0}}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes blink{50%{opacity:0}}
@keyframes float{from{transform:translateY(-5px)}to{transform:translateY(5px)}}
@keyframes pulse{from{transform:scale(1);opacity:.7}to{transform:scale(3.2);opacity:0}}
@keyframes mv2{to{transform:translateX(76.8px)}}
@media (prefers-reduced-motion:reduce){.ch,.fade{animation:none;opacity:1}.off{animation:none;opacity:0}.float,.blink,.pulse{animation:none}.cur{animation:none!important;opacity:0}}
</style>
