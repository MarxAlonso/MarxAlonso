<title id="t">Qué construyo: full-stack, de punta a punta</title>
<desc id="d">Frontend interactivo y responsive: Interfaces rápidas, animadas y cuidadas al detalle con TypeScript y Tailwind, que se ven bien en cualquier pantalla. Backend escalable en producción: APIs y servicios en Node.js, Python, Go, Java y PHP, pensados para crecer y mantenerse en el tiempo. WordPress profesional a medida: Sitios con Elementor y Divi, temas hijo y código personalizado, optimizados en rendimiento y SEO técnico.</desc>
