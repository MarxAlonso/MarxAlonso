<style>
.m{font-family:ui-monospace,SFMono-Regular,'SF Mono','Cascadia Mono','JetBrains Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace}
.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
.d{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:700;text-transform:uppercase}
.ch{opacity:0;animation:on .01s linear forwards}
.off{animation:off .01s linear forwards}
.fade{opacity:0;animation:on 1s ease forwards}
.blink{animation:blink 1.1s steps(1) infinite}
.rise{transform:translateY(112%);animation:rise 1.1s cubic-bezier(.16,1,.3,1) forwards}
.float{animation:float 5.2s ease-in-out infinite alternate}
.trazo{stroke-dasharray:46 134;animation:trazo 6.5s linear infinite}
.nodo{animation:nodo 3.4s ease-in-out infinite}
.pk{stroke-dasharray:30 600;stroke-dashoffset:30;animation:pk 2.6s linear infinite}
.lift{animation:lift 30s linear infinite}
.glow{opacity:0;animation:glow 30s linear infinite}
.slot{opacity:0;animation:slot 30s steps(1,end) infinite}
.cinta{animation:cinta 70s linear infinite}
@keyframes on{to{opacity:1}}
@keyframes off{to{opacity:0}}
@keyframes blink{50%{opacity:0}}
@keyframes rise{to{transform:translateY(0)}}
@keyframes float{from{transform:translateY(-6px)}to{transform:translateY(6px)}}
@keyframes trazo{to{stroke-dashoffset:-180}}
@keyframes nodo{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes pk{to{stroke-dashoffset:-230}}
@keyframes lift{0%{transform:translateY(0)}1%,5.56%{transform:translateY(-20px)}6.56%,100%{transform:translateY(0)}}
@keyframes glow{0%{opacity:0}1%,5.56%{opacity:1}6.56%,100%{opacity:0}}
@keyframes slot{0%{opacity:1}5.56%,100%{opacity:0}}
@keyframes mv0{to{transform:translateX(113.4px)}}
@keyframes mv1{to{transform:translateX(145.8px)}}
@media (prefers-reduced-motion:reduce){.ch,.fade{animation:none;opacity:1}.off{animation:none;opacity:0}.rise{animation:none;transform:none}.float,.blink,.trazo,.nodo,.pk,.lift,.glow,.cinta{animation:none}.slot{animation:none}.slot.s0{opacity:1}.cur{animation:none!important;opacity:0}}
</style>
