<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 156" width="1200" height="156" role="img" aria-labelledby="t d">
<title id="t">Actividad en GitHub</title>
<desc id="d">Estadísticas, lenguajes más usados y racha de contribuciones.</desc>
<defs>
<clipPath id="card"><rect width="1200" height="156" rx="14"/></clipPath>
<pattern id="hex" width="28" height="49" patternUnits="userSpaceOnUse"><path fill="#a78bfa" d="M13.99 9.25l13 7.5v15l-13 7.5L1 31.75v-15l12.99-7.5zM3 17.9v12.7l10.99 6.34 11-6.35V17.9l-11-6.34L3 17.9zM0 15l12.98-7.5V0h-2v6.35L0 12.69v2.3zm0 18.5L12.98 41v8h-2v-6.85L0 35.81v-2.3zM15 0v7.5L27.99 15H28v-2.31h-.01L17 6.35V0h-2zm0 49v-8l12.99-7.5H28v2.31h-.01L17 42.15V49h-2z"/></pattern>
<radialGradient id="hm" cx="0.85" cy="0.3" r="0.45"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>
<mask id="hmk"><rect width="1200" height="156" fill="url(#hm)"/></mask>
<filter id="sh" x="-30%" y="-30%" width="160%" height="190%"><feDropShadow dx="0" dy="22" stdDeviation="20" flood-color="#4c1d95" flood-opacity=".65"/></filter>

</defs>
<style>
.m{font-family:ui-monospace,SFMono-Regular,'SF Mono','Cascadia Mono','JetBrains Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace}
.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
.d{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:700;text-transform:uppercase}
.ch{opacity:0;animation:on .01s linear forwards}
.off{animation:off .01s linear forwards}
.fade{opacity:0;animation:on 1s ease forwards}
.blink{animation:blink 1.1s steps(1) infinite}
.rise{transform:translateY(112%);animation:rise 1.1s cubic-bezier(.16,1,.3,1) forwards}
.float{animation:float 5.2s ease-in-out infinite alternate}
.trazo{stroke-dasharray:46 134;animation:trazo 6.5s linear infinite}
.nodo{animation:nodo 3.4s ease-in-out infinite}
.pk{stroke-dasharray:30 600;stroke-dashoffset:30;animation:pk 2.6s linear infinite}
.lift{animation:lift 30s linear infinite}
.glow{opacity:0;animation:glow 30s linear infinite}
.slot{opacity:0;animation:slot 30s steps(1,end) infinite}
.cinta{animation:cinta 70s linear infinite}
@keyframes on{to{opacity:1}}
@keyframes off{to{opacity:0}}
@keyframes blink{50%{opacity:0}}
@keyframes rise{to{transform:translateY(0)}}
@keyframes float{from{transform:translateY(-6px)}to{transform:translateY(6px)}}
@keyframes trazo{to{stroke-dashoffset:-180}}
@keyframes nodo{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes pk{to{stroke-dashoffset:-230}}
@keyframes lift{0%{transform:translateY(0)}1%,5.56%{transform:translateY(-20px)}6.56%,100%{transform:translateY(0)}}
@keyframes glow{0%{opacity:0}1%,5.56%{opacity:1}6.56%,100%{opacity:0}}
@keyframes slot{0%{opacity:1}5.56%,100%{opacity:0}}

@media (prefers-reduced-motion:reduce){.ch,.fade{animation:none;opacity:1}.off{animation:none;opacity:0}.rise{animation:none;transform:none}.float,.blink,.trazo,.nodo,.pk,.lift,.glow,.cinta{animation:none}.slot{animation:none}.slot.s0{opacity:1}.cur{animation:none!important;opacity:0}}
</style>
<g clip-path="url(#card)">
<rect width="1200" height="156" fill="#07040f"/>

<rect width="1200" height="156" fill="url(#hex)" opacity="0.18" mask="url(#hmk)"/>
<g transform="translate(930 -60) scale(1)" fill="none" stroke="#a78bfa" stroke-width="1.2" stroke-opacity=".5"><path class="trazo" style="animation-delay:0s" d="M34 6l26 15v30l-26 15-26-15v-30z"/><path class="trazo" style="animation-delay:-1.3s" d="M86 6l26 15v30l-26 15-26-15v-30z"/><path class="trazo" style="animation-delay:-2.6s" d="M190 6l26 15v30l-26 15-26-15v-30z"/><path class="trazo" style="animation-delay:-3.9s" d="M60 51l26 15v30l-26 15-26-15v-30z"/><path class="trazo" style="animation-delay:-5.2s" d="M112 51l26 15v30l-26 15-26-15v-30z"/><path class="trazo" style="animation-delay:0s" d="M164 51l26 15v30l-26 15-26-15v-30z"/><path class="trazo" style="animation-delay:-1.3s" d="M86 96l26 15v30l-26 15-26-15v-30z"/><path class="trazo" style="animation-delay:-2.6s" d="M138 96l26 15v30l-26 15-26-15v-30z"/><path class="trazo" style="animation-delay:-3.9s" d="M190 96l26 15v30l-26 15-26-15v-30z"/><path class="trazo" style="animation-delay:-5.2s" d="M60 141l26 15v30l-26 15-26-15v-30z"/><path class="trazo" style="animation-delay:0s" d="M164 141l26 15v30l-26 15-26-15v-30z"/><circle class="nodo" style="animation-delay:0s" cx="34" cy="6" r="3" fill="#c4b5fd"/><circle class="nodo" style="animation-delay:-0.7s" cx="60" cy="51" r="3" fill="#c4b5fd"/><circle class="nodo" style="animation-delay:-1.4s" cx="86" cy="96" r="3" fill="#c4b5fd"/><circle class="nodo" style="animation-delay:-2.1s" cx="60" cy="141" r="3" fill="#c4b5fd"/></g><g class="m"><text x="56" y="62" font-size="13" font-weight="500" fill="#a78bfa" textLength="248.04">// ~/GITHUB · ACTIVIDAD</text></g><text class="d" x="54" y="118" font-size="44" letter-spacing="-1.76" fill="#ece8f7"><tspan>Código en </tspan><tspan fill="#a78bfa">GitHub</tspan></text>
</g>
<rect x=".5" y=".5" width="1199" height="155" rx="13.5" fill="none" stroke="#fff" stroke-opacity=".11"/>
</svg>
